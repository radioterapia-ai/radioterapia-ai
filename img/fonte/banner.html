<!doctype html>
<!--
  O cabeçalho do perfil: 1280 × 640, a mesma medida do banner do PhotoID RT e
  da Local Suite, e o mesmo esqueleto — rótulo em mono no topo, o nome grande,
  uma frase, o fio, e o rodapé com o handle.

  A FRASE DE CIMA É DELE, e o nome logo abaixo é a assinatura: epígrafe e
  autor, na ordem em que se lê uma citação. A aspa de abertura fica PENDURADA
  na margem (text-indent negativo), para que a primeira letra, e não a aspa,
  alinhe com o rótulo do topo e com o nome. Ela vem em Lora Italic, a face de
  citação, sem negrito e menor que o subtítulo: se lê como epígrafe.

  O GRADIENTE APARECE DUAS VEZES E SÓ DUAS: o fim da frase (o peso vai na
  segunda metade, que é a assinatura de escrita dele) e o handle do rodapé. Por
  isso o subtítulo, logo abaixo do nome, fica em tom secundário: duas frases
  no gradiente disputariam qual se lê primeiro.

  O nome fica em branco puro: não há sufixo de família num nome de pessoa, e
  pôr o sobrenome no gradiente o leria como produto.

  Gerado por gerar.py. Não edite o PNG à mão: edite isto e rode o gerador.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>banner</title>
<link rel="stylesheet" href="nocturne.css">
<style>
  html, body { width: 1280px; height: 640px; }

  .orbita.um   { width: 760px; height: 760px; left: 830px;  top: -60px; }
  .orbita.dois { width: 1120px; height: 1120px; left: 650px; top: -240px; }

  .topo {
    position: absolute; left: var(--margem); top: 87px;
    font-size: 18px; line-height: 1; letter-spacing: 4.3px;
  }

  /* Lora Italic, a face de citação (nocturne.css), em 26 px: menor que a
     Outfit de 30 px de antes, para a frase ler como epígrafe do nome, e não
     como um segundo título. */
  .citacao {
    position: absolute; left: var(--margem); top: 150px;
    font-family: "Lora", serif; font-style: italic;
    font-weight: 400; font-size: 26px; line-height: 36px;
    color: var(--ink); white-space: nowrap;
    text-indent: -12px;              /* a aspa pendurada na margem */
  }
  /* o itálico avança sobre a direita da caixa, e o gradiente recortado no
     texto cortaria o fim da aspa sem este respiro */
  .citacao .grad { padding-right: 6px; }

  .logo {
    position: absolute; left: 73px; top: 268px;
    font-weight: 700; font-size: 110px; line-height: 1;
    letter-spacing: -1.2px; white-space: nowrap;
  }

  .sub {
    position: absolute; left: var(--margem); top: 404px;
    font-weight: 400; font-size: 34px; line-height: 1;
    color: var(--ink-soft); white-space: nowrap;
  }

  .fio.divisor { top: 508px; }

  .rodape-rot {
    position: absolute; left: var(--margem); top: 546px;
    font-size: 21px; line-height: 1; letter-spacing: 4px;
  }
  .handle {
    position: absolute; right: var(--margem); top: 537px;
    font-weight: 400; font-size: 31px; line-height: 1;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="fundo"></div>
  <div class="orbita um"></div>
  <div class="orbita dois"></div>

  <div class="topo mono" data-bloco="topo">RADIOTERAPIA.AI<span class="sep">·</span>RADIATION ONCOLOGY<span class="sep">·</span>RIO DE JANEIRO</div>

  <p class="citacao" data-bloco="citacao">&ldquo;The first cancer cure delivered through a fully AI-automated journey<br>will come from <span class="grad">radiotherapy.&rdquo;</span></p>

  <h1 class="logo" data-bloco="logo">Henrique Braga</h1>
  <p class="sub" data-bloco="sub">Building the future of autonomous healthcare</p>

  <div class="fio divisor"></div>

  <div class="rodape-rot mono" data-bloco="rodape">FMUSP<span class="sep">·</span>HC-FMUSP<span class="sep">·</span>AUTOMATING SINCE 2014</div>
  <div class="handle grad" data-bloco="handle">radioterapia.ai</div>
</body>
</html>
